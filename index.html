<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（構成変更版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      /* 読み込み中表示 */
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 99999;
        display: flex; justify-content: center; align-items: center;
        color: white; font-weight: bold;
      }

      /* 下部に表示する操作パネル（外観認識時のみ表示） */
      #ui-panel {
        position: fixed; bottom: 30px; left: 0; width: 100%;
        text-align: center; z-index: 9999;
        display: none; /* 最初は非表示 */
        pointer-events: none;
      }

      /* WEBサイトへ飛ぶHTMLボタン */
      .ar-btn {
        display: inline-block;
        background-color: #FFD700; /* 金色っぽい黄色 */
        color: black;
        padding: 15px 30px;
        border-radius: 50px;
        font-weight: bold;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        pointer-events: auto; /* ボタンは触れるように */
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="loading">ARを読み込んでいます...</div>

    <div id="ui-panel">
      <button class="ar-btn" onclick="openUrl()">WEBサイトを見る ↗</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        
        <video id="vid-pop2" src="./video_pers2.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#img-pers-1" position="0 0 0" height="1" width="1.5"></a-image>
      </a-entity>

      <a-entity id="target-pop2" mindar-image-target="targetIndex: 1">
        <a-video src="#vid-pop2" position="0 0 0" height="1" width="1.5"></a-video>
      </a-entity>

      <a-entity id="target-outside" mindar-image-target="targetIndex: 2">
        <a-text value="Lykke Hygge" align="center" color="#FFD700" position="0 0 0" scale="2 2 2"></a-text>
      </a-entity>

    </a-scene>

    <script>
      const loadingDiv = document.getElementById('loading');
      const uiPanel = document.getElementById('ui-panel');
      const sceneEl = document.querySelector('a-scene');

      // 各ターゲットと素材の取得
      const targetPop2 = document.getElementById('target-pop2');
      const videoPop2 = document.getElementById('vid-pop2');
      const targetOutside = document.getElementById('target-outside');

      // 読み込み完了
      sceneEl.addEventListener('arReady', () => {
        loadingDiv.style.display = 'none';
      });

      // ▼▼▼ 2枚目（動画）の制御 ▼▼▼
      // 認識したら動画再生
      targetPop2.addEventListener('targetFound', () => {
        videoPop2.play();
      });
      // 見失ったら動画停止（負荷軽減のため）
      targetPop2.addEventListener('targetLost', () => {
        videoPop2.pause();
        videoPop2.currentTime = 0; // 最初に戻す
      });

      // ▼▼▼ 3枚目（外観）の制御 ▼▼▼
      // 認識したらHTMLボタンを表示
      targetOutside.addEventListener('targetFound', () => {
        uiPanel.style.display = 'block';
      });
      // 見失ったらHTMLボタンを隠す
      targetOutside.addEventListener('targetLost', () => {
        uiPanel.style.display = 'none';
      });

      // ▼▼▼ ボタンクリック時の動作 ▼▼▼
      function openUrl() {
        // 【重要】ここに飛ばしたいURLを入れてください
        window.location.href = 'https://lykke-hygge-2.myshopify.com/';
      }
    </script>
  </body>
</html>
