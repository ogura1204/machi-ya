<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（修正完了版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    
    <style>
      /* 全体のフォント設定：明朝体で上品に */
      body { margin: 0; overflow: hidden; font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif; }

      /* 待機画面 */
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #1a1a1a; z-index: 99999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 1.0s ease-out;
      }
      #loading-text {
        color: #f0f0f0; font-size: 14px; letter-spacing: 3px; margin-top: 20px; text-transform: uppercase;
      }
      .loader {
        border: 2px solid rgba(255,255,255,0.1); border-left-color: #ffffff;
        border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* 画面下のフッター */
      #footer-frame {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 10%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); 
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999; pointer-events: none;
      }
      #footer-text {
        color: #ffffff; font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 11px; letter-spacing: 1px; opacity: 0.8;
      }

      /* ▼▼▼ 外観用の演出テキスト（HTMLオーバーレイ） ▼▼▼ */
      #outside-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 8888;
        display: none; /* 最初は隠す */
        justify-content: center; align-items: center;
      }
      
      /* 文字の共通デザイン */
      .credit-text {
        position: absolute;
        color: white;
        font-size: 24px;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8); /* 影をつけて読みやすく */
        opacity: 0; /* 最初は透明 */
        width: 100%; text-align: center;
      }

      /* アニメーション設定：クロスフェード */
      /* 日本語：0秒〜4秒で表示、4秒〜8秒で消える */
      #text-jp { animation: fadeLoop 8s infinite; }
      /* 英語：4秒〜8秒で表示、8秒〜12秒(0秒)で消える */
      #text-en { animation: fadeLoop 8s infinite; animation-delay: 4s; }

      @keyframes fadeLoop {
        0% { opacity: 0; transform: translateY(10px); }
        20% { opacity: 1; transform: translateY(0); } /* ふわっと現れる */
        40% { opacity: 1; } /* しばらく表示 */
        60% { opacity: 0; transform: translateY(-10px); } /* ふわっと消える */
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>

    <div id="loading">
      <div class="loader"></div>
      <div id="loading-text">Loading AR Experience</div>
    </div>

    <div id="footer-frame">
      <div id="footer-text">Presented by GPM co.ltd., CLoVER</div>
    </div>

    <div id="outside-overlay">
      <div id="text-jp" class="credit-text">作成者：小椋聡介</div>
      <div id="text-en" class="credit-text">presented by ogura sousuke</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        <video id="vid-pop2" src="./fl.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image id="ar-image-1" src="#img-pers-1" position="0 0 0" width="1"></a-image>
        <a-entity position="0 -0.6 0">
            <a-entity position="2 0 0" animation="property: position; from: 2 0 0; to: -2 0 0; dur: 6000; easing: linear; loop: true">
                <a-text value="Miyabe Airi" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
        <a-entity position="0 -0.8 0">
            <a-entity position="2 0 0" animation="property: position; from: 2 0 0; to: -2 0 0; dur: 6500; easing: linear; loop: true">
                 <a-text value="victorina-vc" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="target-pop2" mindar-image-target="targetIndex: 1">
        <a-video id="ar-video-1" src="#vid-pop2" position="0 0 0" width="1"></a-video>
      </a-entity>

      <a-entity id="target-outside" mindar-image-target="targetIndex: 2">
        <a-entity position="0 0 -2" particle-system="
            preset: dust; 
            color: #FFD700, #F0E68C, #FFFACD; 
            particleCount: 300; 
            size: 1.2;
            velocityValue: 0 1.5 0; 
            randomise: true;
            maxAge: 4;
            opacity: 0.8;">
        </a-entity>
      </a-entity>

    </a-scene>

    <script>
      const loadingDiv = document.getElementById('loading');
      const targetPop2 = document.getElementById('target-pop2');
      const videoPop2 = document.getElementById('vid-pop2');
      const targetOutside = document.getElementById('target-outside');
      const outsideOverlay = document.getElementById('outside-overlay');
      const sceneEl = document.querySelector('a-scene');

      // 読み込み完了時の処理
      sceneEl.addEventListener('arReady', () => {
        // ロード画面を消す
        loadingDiv.style.opacity = 0;
        setTimeout(() => { loadingDiv.style.display = 'none'; }, 1000);
        
        // 画像・動画のサイズ調整
        resizeElement('ar-image-1', 'img-pers-1');
        resizeElement('ar-video-1', 'vid-pop2');
      });

      // エラー時の強制解除（万が一止まった場合用）
      setTimeout(() => {
        if(loadingDiv.style.display !== 'none') {
            loadingDiv.style.display = 'none';
        }
      }, 10000); // 10秒経ってもダメなら強制的に消す

      // 2枚目（動画）制御
      targetPop2.addEventListener('targetFound', () => { videoPop2.play(); });
      targetPop2.addEventListener('targetLost', () => { videoPop2.pause(); });

      // 3枚目（外観）制御
      targetOutside.addEventListener('targetFound', () => {
        // 外観を見つけたら、オシャレな文字パネルを表示
        outsideOverlay.style.display = 'flex';
      });
      targetOutside.addEventListener('targetLost', () => {
        // 見失ったら隠す
        outsideOverlay.style.display = 'none';
      });

      // 自動リサイズ関数
      function resizeElement(arEntityId, sourceId) {
        const arEntity = document.getElementById(arEntityId);
        const source = document.getElementById(sourceId);
        const setSize = () => {
          let w, h;
          if (source.tagName === 'IMG') { w = source.naturalWidth; h = source.naturalHeight; }
          else if (source.tagName === 'VIDEO') { w = source.videoWidth; h = source.videoHeight; }
          if (w && h) {
            const ratio = h / w;
            arEntity.setAttribute('height', ratio);
          }
        };
        if (source.complete || source.readyState >= 1) setSize();
        else { source.onload = setSize; source.onloadedmetadata = setSize; }
      }
    </script>
  </body>
</html>
