<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（シンプル＆演出強化版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: serif; }

      /* 読み込み中表示 */
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 99999;
        display: flex; justify-content: center; align-items: center;
        color: white; font-weight: bold; font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="loading">ARを読み込んでいます...</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        
        <video id="vid-pop2" src="./fl.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#img-pers-1" position="0 0 0" height="1" width="1.5"></a-image>
      </a-entity>

      <a-entity id="target-pop2" mindar-image-target="targetIndex: 1">
        <a-video src="#vid-pop2" position="0 0 0" height="1" width="1.5"></a-video>
      </a-entity>

      <a-entity id="target-outside" mindar-image-target="targetIndex: 2">
        
        <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear">
          
          <a-text 
            value="Lykke Hygge" 
            font="serif"
            align="center" 
            color="black" 
            position="0.03 -0.03 -0.01" 
            scale="2 2 2"
            opacity="0.8">
          </a-text>

          <a-text 
            value="Lykke Hygge" 
            font="serif"
            align="center" 
            color="white" 
            position="0 0 0" 
            scale="2 2 2">
          </a-text>

        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      const loadingDiv = document.getElementById('loading');
      const targetPop2 = document.getElementById('target-pop2');
      const videoPop2 = document.getElementById('vid-pop2');
      const sceneEl = document.querySelector('a-scene');

      // AR準備完了
      sceneEl.addEventListener('arReady', () => {
        loadingDiv.style.display = 'none';
      });

      // ▼▼▼ 2枚目（動画）の制御 ▼▼▼
      targetPop2.addEventListener('targetFound', () => {
        // ボタンがないので自動再生のみ
        videoPop2.play();
      });

      targetPop2.addEventListener('targetLost', () => {
        videoPop2.pause();
      });

      // 3枚目（外観）の制御はCSSやボタンがなくなったので不要になりました
    </script>
  </body>
</html>
