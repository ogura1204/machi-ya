<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（再生ボタン版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }

      /* 読み込み中表示 */
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 99999;
        display: flex; justify-content: center; align-items: center;
        color: white; font-weight: bold; font-size: 18px;
      }

      /* 操作パネル（外観認識時のみ表示） */
      #ui-panel {
        position: fixed; bottom: 40px; left: 0; width: 100%;
        text-align: center; z-index: 9999;
        display: none; /* 最初は非表示 */
        pointer-events: none;
      }

      /* 金色の共通ボタンデザイン */
      .ar-btn {
        display: inline-block; background-color: #FFD700; color: black;
        padding: 12px 24px; border-radius: 50px; font-weight: bold; font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto; border: none; cursor: pointer;
        margin: 0 5px;
      }

      /* 再生ボタン（ちょっと大きく） */
      #btn-play { background-color: #FF4500; color: white; display: none; }
    </style>
  </head>
  <body>
    <div id="loading">ARを読み込んでいます...</div>

    <div id="ui-panel">
      <button id="btn-play" class="ar-btn" onclick="forcePlay()">▶ 動画を再生</button>
      <button class="ar-btn" onclick="openUrl()">WEBサイト ↗</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        
        <video id="vid-pop2" src="./movie_fl.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#img-pers-1" position="0 0 0" height="1" width="1.5"></a-image>
      </a-entity>

      <a-entity id="target-pop2" mindar-image-target="targetIndex: 1">
        <a-video src="#vid-pop2" position="0 0 0" height="1" width="1.5"></a-video>
      </a-entity>

      <a-entity id="target-outside" mindar-image-target="targetIndex: 2">
        <a-text value="Lykke Hygge" align="center" color="#FFD700" position="0 0 0" scale="2 2 2"></a-text>
      </a-entity>

    </a-scene>

    <script>
      const loadingDiv = document.getElementById('loading');
      const uiPanel = document.getElementById('ui-panel');
      const btnPlay = document.getElementById('btn-play');
      
      const targetPop2 = document.getElementById('target-pop2');
      const videoPop2 = document.getElementById('vid-pop2');
      const targetOutside = document.getElementById('target-outside');
      const sceneEl = document.querySelector('a-scene');

      // AR準備完了
      sceneEl.addEventListener('arReady', () => {
        loadingDiv.style.display = 'none';
      });

      // ▼▼▼ 2枚目（動画）の制御 ▼▼▼
      targetPop2.addEventListener('targetFound', () => {
        // パネルを出して「再生ボタン」を表示する
        uiPanel.style.display = 'block';
        btnPlay.style.display = 'inline-block';
        
        // とりあえず再生を試みる
        videoPop2.play();
      });

      targetPop2.addEventListener('targetLost', () => {
        videoPop2.pause();
        uiPanel.style.display = 'none'; // パネル隠す
      });

      // ▼▼▼ 3枚目（外観）の制御 ▼▼▼
      targetOutside.addEventListener('targetFound', () => {
        uiPanel.style.display = 'block';
        btnPlay.style.display = 'none'; // 外観の時は再生ボタンはいらない
      });
      targetOutside.addEventListener('targetLost', () => {
        uiPanel.style.display = 'none';
      });

      // ▼▼▼ 強制再生ボタンの処理 ▼▼▼
      function forcePlay() {
        videoPop2.muted = false; // 音を出す
        videoPop2.volume = 1.0;
        videoPop2.play();
      }

      function openUrl() {
        window.location.href = 'https://lykke-hygge-2.myshopify.com/';
      }
    </script>
  </body>
</html>
