<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（完成版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* 全体のフォント設定 */
      body { margin: 0; overflow: hidden; font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif; }

      /* ▼▼▼ 待機画面 ▼▼▼ */
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #1a1a1a; z-index: 99999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 1.0s ease-out;
      }
      #loading-text { color: #f0f0f0; font-size: 14px; letter-spacing: 3px; margin-top: 20px; text-transform: uppercase; }
      .loader { border: 2px solid rgba(255,255,255,0.1); border-left-color: #ffffff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* ▼▼▼ フッター（文字切り替えアニメーション） ▼▼▼ */
      #footer-frame {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 10%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); 
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999;
        pointer-events: auto; cursor: pointer; transition: background 0.3s;
        overflow: hidden; /* 文字のはみ出し防止 */
      }
      #footer-frame:hover { background: rgba(50, 50, 50, 0.8); }

      /* 文字を重ねて配置するためのコンテナ */
      .footer-text-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex; justify-content: center; align-items: center;
      }

      /* 切り替わる2つの文字の共通設定 */
      .f-text {
        position: absolute;
        color: #ffffff;
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 1px;
        opacity: 0; /* 最初は透明 */
        width: 100%; text-align: center;
        transition: opacity 1s ease-in-out; /* ふんわり切り替える */
      }

      /* アニメーションの定義（合計8秒サイクル） */
      /* 1つ目の文字：0-3秒表示 */
      #ft-1 { animation: textCycle1 8s infinite; }
      /* 2つ目の文字：4-7秒表示 */
      #ft-2 { animation: textCycle2 8s infinite; }

      @keyframes textCycle1 {
        0%, 45% { opacity: 1; transform: translateY(0); }
        50%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes textCycle2 {
        0%, 45% { opacity: 0; transform: translateY(5px); }
        50%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-5px); }
      }

      /* ▼▼▼ 外観用の演出：エンドロール ▼▼▼ */
      #outside-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 8888;
        display: none; overflow: hidden;
      }
      
      /* エンドロールのコンテンツ */
      #credit-roll-content {
        position: absolute;
        width: 100%;
        text-align: center;
        color: white;
        text-shadow: 0 2px 10px rgba(0,0,0,1);
        bottom: -150%; /* 初期位置 */
        opacity: 0;
      }

      /* アニメーション用クラス（JSで付け外しする） */
      /* 25秒かけて下から上に流れる */
      .animate-roll {
        animation: rollUp 25s linear forwards;
      }

      @keyframes rollUp {
        0% { bottom: -150%; opacity: 0; }
        5% { opacity: 1; }
        90% { opacity: 1; }
        100% { bottom: 100%; opacity: 0; }
      }

      .credit-section { font-size: 14px; margin-top: 60px; opacity: 0.7; letter-spacing: 3px; text-transform: uppercase; }
      .credit-name { font-size: 26px; margin-top: 15px; font-weight: bold; letter-spacing: 5px; }
      .credit-logo {
        margin-top: 80px; width: 180px; height: auto;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
      }
    </style>
  </head>
  <body>

    <div id="loading">
      <div class="loader"></div>
      <div id="loading-text">Loading AR Experience</div>
    </div>

    <div id="footer-frame">
      <div class="footer-text-container">
        <div id="ft-1" class="f-text">GPM co., ltd, CLoVER Dept.</div>
        <div id="ft-2" class="f-text">Tap for Link ↗</div>
      </div>
    </div>

    <div id="outside-overlay">
      <div id="credit-roll-content">
        
        <div class="credit-section">Presented by</div>
        <div class="credit-name">Ogura Sousuke</div>
        <div class="credit-section">do u?</div>
        <div class="credit-name">ii kanji desho?</div>
        <div class="credit-section">kore ha mou</div>
        <div class="credit-name">min na happy dane!</div>

        <img src="./logo.png" class="credit-logo" alt="GPM CLoVER Logo">
      </div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        <video id="vid-pop2" src="./fl.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image id="ar-image-1" src="#img-pers-1" position="0 0 0" width="1"></a-image>
        <a-entity position="0 -0.6 0">
            <a-entity position="2 0 0" animation="property: position; from: 2 0 0; to: -2 0 0; dur: 6000; easing: linear; loop: true">
                <a-text value="Miyabe Airi" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
        <a-entity position="0 -0.8 0">
            <a-entity position="2 0 0" animation="property: position; from: 2 0 0; to: -2 0 0; dur: 6500; easing: linear; loop: true">
                 <a-text value="victorina-vc" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="target-pop2" mindar-image-target="targetIndex: 1">
        <a-video id="ar-video-1" src="#vid-pop2" position="0 0 0" width="1"></a-video>
      </a-entity>

      <a-entity id="target-outside" mindar-image-target="targetIndex: 2">
      </a-entity>

    </a-scene>

    <script>
      const loadingDiv = document.getElementById('loading');
      const footerFrame = document.getElementById('footer-frame');
      const targetPop2 = document.getElementById('target-pop2');
      const videoPop2 = document.getElementById('vid-pop2');
      const targetOutside = document.getElementById('target-outside');
      const outsideOverlay = document.getElementById('outside-overlay');
      const creditContent = document.getElementById('credit-roll-content');
      const sceneEl = document.querySelector('a-scene');

      let rollTimer = null; // 2秒待機用のタイマー

      // 読み込み完了時
      sceneEl.addEventListener('arReady', () => {
        loadingDiv.style.opacity = 0;
        setTimeout(() => { loadingDiv.style.display = 'none'; }, 1000);
        resizeElement('ar-image-1', 'img-pers-1');
        resizeElement('ar-video-1', 'vid-pop2');
      });
      setTimeout(() => { if(loadingDiv.style.display !== 'none') loadingDiv.style.display = 'none'; }, 10000);

      // ▼ フッターリンク（クリックでショップへ）
      footerFrame.addEventListener('click', () => {
        window.open('https://lykke-hygge-2.myshopify.com/', '_blank'); 
      });

      // 動画制御
      targetPop2.addEventListener('targetFound', () => { videoPop2.play(); });
      targetPop2.addEventListener('targetLost', () => { videoPop2.pause(); });

      // ▼▼▼ エンドロール制御（2秒待機ループシステム） ▼▼▼
      
      // アニメーションを開始する関数
      function startRoll() {
        // クラスを一旦消してリセット（再描画させる）
        creditContent.classList.remove('animate-roll');
        void creditContent.offsetWidth; // リフロー（強制再描画）
        
        // 2秒待ってからクラスを付与＝スタート
        rollTimer = setTimeout(() => {
          creditContent.classList.add('animate-roll');
        }, 2000);
      }

      // 1回のアニメーションが終わった時の処理
      creditContent.addEventListener('animationend', () => {
        // 終わったら次のループへ（startRollを呼ぶと中でまた2秒待ってくれる）
        startRoll();
      });

      // 外観を認識した時
      targetOutside.addEventListener('targetFound', () => {
        outsideOverlay.style.display = 'block';
        startRoll(); // 最初の開始（2秒待ちます）
      });

      // 外観を見失った時
      targetOutside.addEventListener('targetLost', () => {
        outsideOverlay.style.display = 'none';
        creditContent.classList.remove('animate-roll'); // 止める
        if (rollTimer) clearTimeout(rollTimer); // 待機中ならキャンセル
      });

      // 自動リサイズ関数
      function resizeElement(arEntityId, sourceId) {
        const arEntity = document.getElementById(arEntityId);
        const source = document.getElementById(sourceId);
        const setSize = () => {
          let w, h;
          if (source.tagName === 'IMG') { w = source.naturalWidth; h = source.naturalHeight; }
          else if (source.tagName === 'VIDEO') { w = source.videoWidth; h = source.videoHeight; }
          if (w && h) { const ratio = h / w; arEntity.setAttribute('height', ratio); }
        };
        if (source.complete || source.readyState >= 1) setSize();
        else { source.onload = setSize; source.onloadedmetadata = setSize; }
      }
    </script>
  </body>
</html>
