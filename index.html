<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（揺れ対策＆花火演出）</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    
    <style>
      /* 基本設定 */
      body { margin: 0; overflow: hidden; font-family: "Times New Roman", "YuMincho", "Hiragino Mincho ProN", serif; }

      /* 待機画面 */
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #1a1a1a; z-index: 99999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 1.0s ease-out;
      }
      #loading-text {
        color: #f0f0f0; font-size: 14px; letter-spacing: 3px; margin-top: 20px; text-transform: uppercase;
      }
      .loader {
        border: 2px solid rgba(255,255,255,0.1); border-left-color: #ffffff;
        border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* フッター */
      #footer-frame {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 10%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); 
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999; pointer-events: none;
      }
      #footer-text {
        color: #ffffff; font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 11px; letter-spacing: 1px; opacity: 0.8;
      }
    </style>
  </head>
  <body>

    <div id="loading">
      <div class="loader"></div>
      <div id="loading-text">Loading AR Experience</div>
    </div>

    <div id="footer-frame">
      <div id="footer-text">Presented by GPM co.ltd., CLoVER</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no; filterMinCF:0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        <video id="vid-pop2" src="./fl.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image id="ar-image-1" src="#img-pers-1" position="0 0 0" width="1"></a-image>
        <a-entity position="0 -0.6 0">
            <a-entity position="2 0 0" animation="property: position; from: 2 0 0; to: -2 0 0; dur: 6000; easing: linear; loop: true">
                <a-text value="Miyabe Airi" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
        <a-entity position="0 -0.8 0">
            <a-entity position="2 0 0" animation="property: position; from: 2 0 0; to: -2 0 0; dur: 6500; easing: linear; loop: true">
                 <a-text value="victorina-vc" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
            </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="target-pop2" mindar-image-target="targetIndex: 1">
        <a-video id="ar-video-1" src="#vid-pop2" position="0 0 0" width="1"></a-video>
      </a-entity>

      <a-entity id="target-outside" mindar-image-target="targetIndex: 2">
        
        <a-entity position="0 -1 -1" particle-system="
            preset: dust; 
            color: #FFD700, #C0C0C0, #FADADD; 
            particleCount: 400; 
            size: 0.8;
            velocityValue: 0 3 0; 
            randomise: true;
            maxAge: 3;">
        </a-entity>

        <a-text 
            value="作成者：小椋聡介" 
            font="serif" align="center" color="white" position="0 0 0" scale="1.8 1.8 1.8" opacity="1"
            animation="property: opacity; from: 1; to: 0; dir: alternate; dur: 4000; loop: true; easing: easeInOutQuad">
        </a-text>

        <a-text 
            value="presented by ogura sousuke" 
            font="serif" align="center" color="white" position="0 0 0" scale="1.8 1.8 1.8" opacity="0"
            animation="property: opacity; from: 0; to: 1; dir: alternate; dur: 4000; loop: true; easing: easeInOutQuad">
        </a-text>

      </a-entity>

    </a-scene>

    <script>
      const loadingDiv = document.getElementById('loading');
      const targetPop2 = document.getElementById('target-pop2');
      const videoPop2 = document.getElementById('vid-pop2');
      const sceneEl = document.querySelector('a-scene');

      sceneEl.addEventListener('arReady', () => {
        loadingDiv.style.opacity = 0;
        setTimeout(() => { loadingDiv.style.display = 'none'; }, 1000);
        resizeElement('ar-image-1', 'img-pers-1');
        resizeElement('ar-video-1', 'vid-pop2');
      });

      // 動画制御
      targetPop2.addEventListener('targetFound', () => { videoPop2.play(); });
      targetPop2.addEventListener('targetLost', () => { videoPop2.pause(); });

      // 自動リサイズ関数
      function resizeElement(arEntityId, sourceId) {
        const arEntity = document.getElementById(arEntityId);
        const source = document.getElementById(sourceId);
        const setSize = () => {
          let w, h;
          if (source.tagName === 'IMG') { w = source.naturalWidth; h = source.naturalHeight; }
          else if (source.tagName === 'VIDEO') { w = source.videoWidth; h = source.videoHeight; }
          if (w && h) {
            const ratio = h / w;
            arEntity.setAttribute('height', ratio);
          }
        };
        if (source.complete || source.readyState >= 1) setSize();
        else { source.onload = setSize; source.onloadedmetadata = setSize; }
      }
    </script>
  </body>
</html>
