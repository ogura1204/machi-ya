<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>町家の日 AR（動画＆リンク修正版）</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* 読み込み中の表示 */
      #loading {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: white; font-weight: bold; font-size: 20px; z-index: 999;
        text-align: center; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px;
      }
      /* 「タップしてスタート」の案内 */
      #tap-to-start {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.4); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
        color: white; font-size: 24px; font-weight: bold;
        pointer-events: none; /* 下の要素を触れるようにする */
        opacity: 0; transition: opacity 0.5s;
      }
    </style>
  </head>
  <body>
    <div id="loading">読み込み中...</div>
    <div id="tap-to-start">画面をタップして開始</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiError:yes; uiLoading:no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="img-pers-1" src="./pers_1.png" />
        <img id="img-pers-2" src="./pers_2.mp4" />
        
        <video id="vid-main" src="./video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-entity>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#img-pers-1" position="0 0 0" height="1" width="1.5"></a-image>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-image src="#img-pers-2" position="0 0 0" height="1" width="1.5"></a-image>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        
        <a-video src="#vid-main" position="0 0.5 0" width="1.5" height="1"></a-video>

        <a-entity id="web-btn" position="0 -0.5 0" class="clickable">
            <a-plane color="black" opacity="0.8" width="2" height="0.5"></a-plane>
            <a-text value="Open Website >" align="center" color="white" width="4" position="0 0 0.01"></a-text>
        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const loadingDiv = document.getElementById('loading');
      const tapMsg = document.getElementById('tap-to-start');
      const video = document.getElementById('vid-main');
      const webBtn = document.getElementById('web-btn');

      // 読み込み完了時
      sceneEl.addEventListener('arReady', (event) => {
        loadingDiv.style.display = 'none';
        
        // 動画再生のために「タップしてね」を表示
        tapMsg.style.opacity = 1;
        
        console.log("AR Ready");
      });

      // 【修正4】画面のどこかをタップしたら動画を強制再生する（スマホ対策）
      document.body.addEventListener('click', () => {
        if (video.paused) {
          video.play();
          tapMsg.style.opacity = 0; // メッセージを消す
          console.log("Video playing...");
        }
      }, { once: false }); // 何度でも反応するように設定

      // 【修正5】ボタンのクリックイベント（確実に動く書き方）
      webBtn.addEventListener('click', function (evt) {
        console.log("Button clicked!");
        // ここにURLを入れてください
        window.open('https://lykke-hygge-2.myshopify.com/', '_blank');
      });

    </script>
  </body>
</html>
